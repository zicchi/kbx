<!DOCTYPE html>
<html>
<head>
    <title>Cytoscape.js Local Example</title>
    <!-- Load Cytoscape.js via CDN -->
    <script src="assets/cytoscape.min.js"></script>
    <style>
        #cy {
            width: 100%;
            height: 600px;
            display: block;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div id="cy"></div>

    <script>
        // Inline your graph data directly into the script
        var cy = cytoscape({
            container: document.getElementById('cy'),
            elements: [
                { data: { id: 'a' } },
                { data: { id: 'b' } },
                { data: { id: 'ab', source: 'a', target: 'b' } }
            ],
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#0074D9',
                        'label': 'data(id)'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 3,
                        'line-color': '#999',
                        'target-arrow-color': '#999',
                        'target-arrow-shape': 'triangle'
                    }
                }
            ],
            layout: {
                name: 'grid',
                rows: 1
            }
        });
    </script>
</body>
</html>
